<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mandarim Aula</title>

    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body>

    <div class="ink-mountain mountain-1"></div>
    <div class="ink-mountain mountain-2"></div>


    <!-- =========================
         TELA DE LOGIN
    ========================== -->

    <main id="loginScreen" class="login-screen">

        <section class="login-card">

            <div class="seal">学</div>

            <div class="title-area">

                <div class="chinese-title">
                    中文
                </div>

                <h1>Mandarim Aula</h1>

                <p>
                    学习 · 练习 · 进步
                </p>

            </div>


            <div class="divider">
                <span>◆</span>
            </div>


            <form
                class="login-form"
                onsubmit="entrar(event)"
            >

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >


                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Sua senha"
                    required
                >


                <button
                    type="submit"
                    class="primary-button"
                >
                    Entrar
                </button>


                <button
                    type="button"
                    class="secondary-button"
                    onclick="criarConta()"
                >
                    Criar conta
                </button>

            </form>


            <p
                class="login-message"
                id="loginMessage"
            ></p>


            <footer>
                汉语学习平台
            </footer>

        </section>

    </main>



    <!-- =========================
         SITE INTERNO
    ========================== -->

    <main
        id="appScreen"
        class="app-screen hidden"
    >


        <!-- CABEÇALHO -->

        <header class="app-header">

            <div class="app-brand">

                <strong>
                    中文 · Mandarim Aula
                </strong>

                <div id="userInfo"></div>

            </div>


            <div class="header-actions">

                <button
                    id="modeButton"
                    class="mode-button hidden"
                    onclick="alternarModo()"
                >
                    👨‍🏫 Modo Professor
                </button>


                <button
                    class="logout-button"
                    onclick="sair()"
                >
                    Sair
                </button>

            </div>

        </header>



        <!-- PAINEL -->

        <section class="dashboard">

            <h1 id="welcomeTitle">
                Bem-vindo
            </h1>

            <p id="modeDescription">
                Área do aluno
            </p>



            <div class="dashboard-grid">


                <!-- AULA DA SEMANA -->

                <div class="dashboard-card">

                    <div class="card-icon">
                        🗂️
                    </div>

                    <h3>
                        Aula da semana
                    </h3>

                    <p>
                        Conteúdo atual e atividades.
                    </p>

                </div>



                <!-- FLASHCARDS -->

                <div class="dashboard-card">

                    <div class="card-icon">
                        🃏
                    </div>

                    <h3>
                        Flashcards
                    </h3>

                    <p>
                        Vocabulário e revisão.
                    </p>

                </div>



                <!-- LEITURA -->

                <div class="dashboard-card">

                    <div class="card-icon">
                        📖
                    </div>

                    <h3>
                        Leitura
                    </h3>

                    <p>
                        Leitura da semana.
                    </p>

                </div>



                <!-- PROGRESSO -->

                <div class="dashboard-card">

                    <div class="card-icon">
                        📊
                    </div>

                    <h3>
                        Meu progresso
                    </h3>

                    <p>
                        Desempenho e frequência.
                    </p>

                </div>


            </div>

        </section>

    </main>



    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="js/app.js?v=2"
    ></script>

</body>

</html>
