<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandarim Aula</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="ink-mountain mountain-1"></div>
    <div class="ink-mountain mountain-2"></div>

    <main class="login-screen">

        <section class="login-card">

            <div class="seal">学</div>

            <div class="title-area">
                <div class="chinese-title">中文</div>
                <h1>Mandarim Aula</h1>
                <p>学习 · 练习 · 进步</p>
            </div>

            <div class="divider">
                <span>◆</span>
            </div>

            <form class="login-form" onsubmit="entrar(event)">

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >

                <label for="password">Senha</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Sua senha"
                    required
                >

                <button type="submit" class="primary-button">
                    Entrar
                </button>

                <button type="button" class="secondary-button">
                    Criar conta
                </button>

            </form>

            <p class="login-message" id="loginMessage"></p>

            <footer>
                汉语学习平台
            </footer>

        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
